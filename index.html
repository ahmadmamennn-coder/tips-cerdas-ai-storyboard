
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10101c">
<title>Tips Cerdas AI Storyboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101c;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#242044,#111827)}
header h1{color:#ffd166;font-size:30px;margin:5px}
header p{color:#c5c5d5}
main{max-width:850px;margin:auto;padding:20px}
.panel{background:#1c1b2c;border:1px solid #39364e;border-radius:16px;padding:20px;margin-bottom:20px}
label{display:block;margin:15px 0 7px;color:#ffd166;font-weight:bold}
input,textarea,select{width:100%;padding:13px;border-radius:9px;border:1px solid #49445f;background:#11101c;color:white;font-size:15px}
textarea{min-height:120px;resize:vertical}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#ffd166;color:#211a0b;font-weight:bold;font-size:16px;margin-top:18px;cursor:pointer}
button:disabled{opacity:.5}
.note{color:#aaa;font-size:13px;line-height:1.5}
#status{margin-top:15px;color:#ffd166}
.scene{border:1px solid #48415e;border-radius:12px;padding:15px;margin:15px 0;background:#151422}
.scene h3{color:#ffd166}
.scene img{width:100%;border-radius:9px}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>
<body>
<header>
<h1>✨ Tips Cerdas AI</h1>
<p>Automatic Storyboard Creator</p>
</header>
<main>
<section class="panel">
<h2>🎬 Buat Storyboard Otomatis</h2>
<p class="note">Masukkan ide cerita dan atur gaya storyboard yang kamu inginkan.</p>

<label>Ide cerita</label>
<textarea id="idea" placeholder="Contoh: Seekor kucing kecil menjadi penjelajah di dunia ajaib..."></textarea>

<label>Bahasa</label>
<select id="language">
<option value="id">Bahasa Indonesia</option>
<option value="en">English</option>
</select>

<label>Gaya visual</label>
<select id="style">
<option value="cinematic">Epic Cinematic</option>
<option value="realistic">Realistic</option>
<option value="anime">Anime</option>
<option value="fantasy">Fantasy</option>
<option value="cartoon">3D Cartoon</option>
</select>

<label>Jumlah adegan</label>
<select id="scenes">
<option value="5">5 adegan</option>
<option value="10" selected>10 adegan</option>
<option value="15">15 adegan</option>
</select>

<button id="generate" onclick="generate()">✨ GENERATE STORYBOARD</button>
<div id="status"></div>
</section>

<section class="panel">
<h2>📖 Hasil Storyboard</h2>
<div id="result" class="note">Hasil cerita dan gambar akan muncul di sini.</div>
<button onclick="downloadText()">⬇️ EKSPOR STORYBOARD TXT</button>
</section>
</main>
<footer>Tips Cerdas AI • Create Your Own Story</footer>

<script>
let latestText = "";

async function generate(){
 const idea=document.getElementById("idea").value.trim();
 const status=document.getElementById("status");
 const result=document.getElementById("result");
 const button=document.getElementById("generate");

 if(!idea){status.textContent="Masukkan ide cerita terlebih dahulu.";return;}

 button.disabled=true;
 status.textContent="Menghubungi AI...";
 result.innerHTML="Sedang membuat storyboard...";

 try{
  const response=await fetch("/api/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    idea,
    language:document.getElementById("language").value,
    style:document.getElementById("style").value,
    scenes:Number(document.getElementById("scenes").value)
   })
  });
  const data=await response.json();
  if(!response.ok) throw new Error(data.error||"Generator belum tersedia.");

  latestText=JSON.stringify(data,null,2);
  result.innerHTML="";
  const title=document.createElement("h2");
  title.textContent=data.title||"Storyboard";
  result.appendChild(title);
  if(data.logline){
   const p=document.createElement("p");
   p.textContent=data.logline;
   result.appendChild(p);
  }
  (data.scenes||[]).forEach((scene,i)=>{
   const card=document.createElement("div");
   card.className="scene";
   const heading=document.createElement("h3");
   heading.textContent="SCENE "+(i+1)+" — "+(scene.title||"Adegan");
   card.appendChild(heading);
   ["visualPrompt","cameraDirection","narration","sound"].forEach((key)=>{
    if(scene[key]){
     const p=document.createElement("p");
     p.textContent=key+": "+scene[key];
     card.appendChild(p);
    }
   });
   result.appendChild(card);
  });
  status.textContent="Storyboard berhasil dibuat!";
 }catch(error){
  status.textContent="AI belum terhubung: "+error.message;
  result.textContent="Tampilan website siap. Integrasi AI akan kita pasang pada langkah berikutnya.";
 }finally{
  button.disabled=false;
 }
}

function downloadText(){
 if(!latestText){alert("Belum ada storyboard untuk diekspor.");return;}
 const blob=new Blob([latestText],{type:"text/plain"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="tips-cerdas-storyboard.txt";
 a.click();
 URL.revokeObjectURL(url);
}
</script>
</body>
</html>
